# Netlify Configuration File for ISAC LMS E-Learning Platform
[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) Client-Side Redirect Rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent aggressive mobile browser caching for instant updates on smartphones
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

